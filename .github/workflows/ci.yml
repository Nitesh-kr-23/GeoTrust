name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pip-audit

      - name: Lint (ruff)
        run: ruff check app ml tests

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Train ML models (needed by tests)
        run: |
          python ml/train_trust_model.py
          python ml/train_pricing_model.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Verify Alembic migration applies cleanly
        run: |
          rm -f geotrust.db
          alembic upgrade head
          rm -f geotrust.db

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t geotrust-backend:ci ./backend
