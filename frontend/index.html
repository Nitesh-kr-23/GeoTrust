<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoTrust — a repair shop you can actually trust, nearby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1f2a;
    --ink-2: #262c3b;
    --paper: #f6f5f1;
    --panel: #ffffff;
    --signal: #d9a62e;
    --signal-deep: #a97918;
    --verified: #1f6f4b;
    --urgent: #b23a2e;
    --line: #e2dfd3;
    --line-dark: rgba(255,255,255,0.14);
    --muted: #6b6f76;
    --muted-light: #a9adc0;
    --display: 'Archivo Black', 'Arial Black', sans-serif;
    --sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  :focus-visible {
    outline: 2px solid var(--signal-deep);
    outline-offset: 2px;
  }

  /* --- Hero --- */
  .hero {
    background: var(--ink);
    color: var(--paper);
    padding: 40px 24px 48px;
    background-image: radial-gradient(circle at 1px 1px, rgba(217,166,46,0.28) 1.2px, transparent 0);
    background-size: 24px 24px;
    background-position: -6px -6px;
  }
  .hero .wrap { max-width: 760px; margin: 0 auto; }
  .hero-content {
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-content, .results { animation: none !important; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
  }
  .brand .mark {
    width: 9px; height: 9px;
    background: var(--signal);
    border-radius: 2px;
    display: inline-block;
  }
  .brand span.word {
    font-family: var(--display);
    font-size: 16px;
    letter-spacing: 0.01em;
  }

  h1.headline {
    font-family: var(--display);
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    max-width: 21ch;
  }
  .hero p.sub {
    margin: 0 0 26px;
    color: var(--muted-light);
    font-size: 15.5px;
    line-height: 1.5;
    max-width: 48ch;
  }

  /* Search console */
  .search-console {
    background: var(--panel);
    border-radius: 14px;
    padding: 8px;
    display: flex;
    gap: 8px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.45);
  }
  .search-console input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 14px;
    font-size: 15.5px;
    font-family: var(--sans);
    color: var(--ink);
    min-width: 0;
  }
  .search-console input:focus { outline: none; }
  .search-console input::placeholder { color: #9a9a95; }
  .search-console button {
    background: var(--signal);
    color: var(--ink);
    border: none;
    border-radius: 9px;
    padding: 0 22px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .search-console button:hover { background: #c99a2a; }
  .search-console button:disabled { opacity: 0.55; cursor: not-allowed; }

  @media (max-width: 520px) {
    .search-console { flex-direction: column; }
    .search-console button { padding: 12px; }
  }

  .loc-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: 13.5px;
    color: var(--muted-light);
  }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted-light);
    text-decoration: underline;
    text-underline-offset: 2px;
    font-size: 13.5px;
    font-family: var(--sans);
    cursor: pointer;
  }
  .link-btn:hover { color: var(--paper); }

  .manual-loc {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .manual-loc input {
    width: 130px;
    padding: 8px 10px;
    border: 1px solid var(--line-dark);
    border-radius: 7px;
    background: var(--ink-2);
    color: var(--paper);
    font-size: 13.5px;
    font-family: var(--sans);
  }
  .manual-loc input::placeholder { color: #6d7284; }

  @media (max-width: 480px) {
    .loc-row { flex-wrap: wrap; row-gap: 4px; }
    .manual-loc { flex-wrap: wrap; }
    .manual-loc input { width: 100%; }
    .manual-loc .link-btn { width: 100%; text-align: left; margin-top: 2px; }
  }

  /* ---Results --- */
  main { max-width: 760px; margin: 0 auto; padding: 28px 24px 60px; }

  .status { font-size: 13.5px; color: var(--muted); min-height: 18px; margin-bottom: 6px; }
  .status.error { color: var(--urgent); }

  .results-heading {
    font-size: 13.5px;
    color: var(--muted);
    margin: 18px 0 12px;
  }
  .results-heading strong { color: var(--ink); }

  .results { animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }

  .shop-row {
    padding: 18px 0;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 28px 56px 1fr auto;
    gap: 16px;
    align-items: start;
  }
  .shop-row:last-child { padding-bottom: 4px; }

  .rank-num {
    font-family: var(--display);
    font-size: 15px;
    color: #cabfa0;
    padding-top: 10px;
    text-align: right;
  }

  @media (max-width: 560px) {
    .shop-row { grid-template-columns: 24px 48px 1fr; }
    .shop-row .call-col { grid-column: 1 / -1; margin-top: 4px; }
  }

  .trust-ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .trust-ring svg { transform: rotate(-90deg); }
  .trust-ring .bg { stroke: var(--line); }
  .trust-ring .fg {
    stroke: var(--signal);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .trust-ring .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }

  .shop-name {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.005em;
  }
  .shop-stats {
    font-size: 13.5px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-bottom: 4px;
  }
  .shop-stats .stat { display: inline-flex; align-items: center; gap: 4px; }
  .stat .price { color: var(--ink); font-weight: 600; }
  .stat .eta { color: var(--muted); }

  .phone-line {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .phone-line strong { color: var(--verified); font-weight: 600; }

  .call-col { display: flex; align-items: flex-start; }
  .call-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .call-btn:hover { background: var(--ink-2); }
  .call-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .call-btn.booked { background: var(--verified); }

  .empty-state {
    padding: 36px 0;
    color: var(--muted);
    font-size: 14.5px;
    border-top: 1px solid var(--line);
  }
  .empty-state .hint { font-size: 13px; margin-top: 6px; color: #9a9a95; }

  footer {
    max-width: 760px; margin: 0 auto 40px; padding: 0 24px;
    font-size: 12px; color: var(--muted);
  }

  /* --- Booking lifecycle --- */
  .lifecycle { grid-column: 1 / -1; margin-top: 4px; }
  .lifecycle:empty { margin: 0; }
  .lifecycle-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .sim-note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  .status-pill {
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    display: inline-block;
  }
  .pill-accepted { background: #fbeed2; color: var(--signal-deep); }
  .pill-completed { background: #e7e5db; color: #55523f; }
  .pill-reviewed { background: #e3f0e9; color: var(--verified); }

  .mini-btn {
    background: var(--panel); border: 1px solid var(--ink); color: var(--ink);
    padding: 7px 13px; font-size: 12.5px; font-weight: 600; border-radius: 7px;
    cursor: pointer;
  }
  .mini-btn:hover { background: var(--ink); color: var(--paper); }

  .review-form {
    margin-top: 10px; display: flex; flex-direction: column; gap: 8px;
    border-top: 1px dashed var(--line); padding-top: 12px;
    max-width: 380px;
  }
  .review-form label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .star-picker { font-size: 24px; letter-spacing: 4px; cursor: pointer; }
  .star-picker .star { color: var(--line); transition: color 0.15s; }
  .star-picker .star.filled { color: var(--signal); }
  .review-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px; font-family: var(--sans); font-size: 13.5px; resize: vertical;
  }
  .review-form .mini-btn { align-self: flex-start; }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="hero-content">
      <div class="brand"><span class="mark"></span><span class="word">GEOTRUST</span></div>
      <h1 class="headline">Find a repair shop you can actually trust</h1>
      <p class="sub">We rank nearby electricians, plumbers, mechanics and repair shops by a trust score built from real reviews — not just a star rating.</p>

      <div class="search-console">
        <input id="query" type="text" list="query-suggestions" placeholder="What do you need? e.g. electrician, plumber, AC repair" autocomplete="off">
        <datalist id="query-suggestions">
          <option value="car repair">
          <option value="electrician">
          <option value="plumber">
          <option value="locksmith">
          <option value="appliance repair">
        </datalist>
        <button id="searchBtn">Search</button>
      </div>

      <div class="loc-row">
        <span id="locStatus">Detecting your location…</span>
        <button class="link-btn" id="manualLocToggle" type="button">Enter manually</button>
      </div>
      <div class="manual-loc" id="manualLocFields" hidden>
        <input id="lat" type="number" step="any" placeholder="Latitude">
        <input id="lng" type="number" step="any" placeholder="Longitude">
        <button class="link-btn" id="useLocBtn" type="button">Use current location</button>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
</main>

<footer>
  API base: <span id="apiBaseLabel"></span> — edit <code>config.js</code> to point at a different backend.
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
