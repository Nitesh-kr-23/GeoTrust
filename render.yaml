services:
  - type: web
    name: geotrust-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free 
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false  
      - key: GOOGLE_PLACES_API_KEY
        sync: false  
      - key: CORS_ALLOWED_ORIGINS
        value: https://geotrust-frontend.onrender.com  
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: geotrust-frontend
    runtime: static
    staticPublishPath: ./frontend
    buildCommand: "echo 'no build step — plain static HTML/JS'"
    envVars: []

  - type: web
    name: geotrust-analytics
    runtime: docker
    dockerfilePath: ./analytics/Dockerfile
    dockerContext: .  
    plan: free  
    envVars:
      - key: DATABASE_URL
        sync: false  
